openapi: 3.0.3
info:
  title: Dreambox Nexus API Specification
  description: Official OpenAPI 3.0 Contract Specification for Nexus Core custom security-first framework (Alpha Release).
  version: 0.1.0
servers:
  - url: http://localhost
    description: Local WSL2 Development Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
    SessionCookie:
      type: apiKey
      in: cookie
      name: nexus_session
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

  schemas:
    MetaEnvelope:
      type: object
      required:
        - trace_id
        - timestamp
      properties:
        trace_id:
          type: string
          example: c1f7a0b8-4d5e-49b9-8e2b-7c3d1f0a2e4b
        timestamp:
          type: string
          format: date-time
          example: '2026-11-08T13:25:00Z'

    StandardSuccessResponse:
      type: object
      required:
        - data
        - meta
        - message
      properties:
        data:
          type: object
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        message:
          type: string
          example: Operation completed successfully.

    StandardErrorResponse:
      type: object
      required:
        - data
        - meta
        - message
      properties:
        data:
          type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        message:
          type: string
          example: The requested resource could not be processed.

paths:
  /ui:
    get:
      summary: Nexus UI Component Framework & Interactive Showcase
      description: Returns the Bootstrap-grade, zero-dependency kitchen sink component library, design system documentation, and live interactive UI playground.
      responses:
        '200':
          description: Interactive UI component library and framework documentation.
          content:
            text/html:
              schema:
                type: string
                description: Complete Bootstrap-style interactive component showcase and code reference.

  /compliance:
    get:
      summary: Compliance Matrix & Regulatory Verification
      description: Returns the real-time regulatory compliance scorecard, framework breakdown (PCI-DSS, HIPAA, NIST, GDPR, OWASP), and automated verification status.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [json, html]
          description: Optional response format (defaults to text/html for browsers, application/json for API clients).
      responses:
        '200':
          description: Compliance matrix and automated audit verification report.
          content:
            text/html:
              schema:
                type: string
                description: Interactive Cyber-Noir compliance dashboard.
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /health:
    get:
      summary: Liveness Probe
      description: Returns HTTP 200 if the web server / PHP runtime is operational.
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /health/ready:
    get:
      summary: Readiness Probe
      description: Verifies database connectivity, storage writeability, and queue health.
      responses:
        '200':
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '503':
          description: Service dependencies unhealthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /api/v1/security/csrf-token:
    get:
      summary: Issue CSRF Token
      description: Generates a cryptographically secure, timing-safe HMAC token bound to the active session.
      responses:
        '200':
          description: CSRF token generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      csrf_token:
                        type: string
                        example: a8f5c3b1e9d2...
                  meta:
                    $ref: '#/components/schemas/MetaEnvelope'
                  message:
                    type: string

  /api/v1/security/csp-reports:
    post:
      summary: Ingest Browser CSP Violation Report
      description: Receives browser Content-Security-Policy violation payloads and forwards to the SOC monitor.
      requestBody:
        required: true
        content:
          application/csp-report:
            schema:
              type: object
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: Report recorded.

  /api/v1/auth/login:
    post:
      summary: User Authentication
      description: Authenticates credentials using Argon2id with 5-strike lockout and optional MFA challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '423':
          description: Account locked due to failed attempts (PCI Req 8.3.4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /api/v1/auth/mfa/verify:
    post:
      summary: Verify TOTP Multi-Factor Authentication
      description: Validates RFC 6238 6-digit one-time code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  example: '492813'
      responses:
        '200':
          description: MFA verification succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          description: Invalid or expired code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: Terminate Session
      description: Invalidates active session and rotates session identifier.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/gdpr/consent:
    post:
      summary: Record Granular Consent
      description: Logs affirmative user consent under GDPR Art 7.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - purpose
                - version
              properties:
                purpose:
                  type: string
                  example: analytics
                version:
                  type: string
                  example: v1.0
      responses:
        '200':
          description: Consent recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/gdpr/export:
    post:
      summary: Request Data Portability Export
      description: Packages all personal data into a machine-readable JSON bundle (GDPR Art 20).
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Export bundle generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/gdpr/erase:
    post:
      summary: Request Right to be Forgotten
      description: Triggers cascading erasure or cryptographic anonymization of PII (GDPR Art 17).
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        '200':
          description: Data shredded / anonymized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /nexus/monitor:
    get:
      summary: Cyber-Noir Framework Monitor & Diagnostic Cockpit
      description: Interactive administrative observability HUD. Restricted to authorized administrators and local SecOps.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Cockpit HTML dashboard rendered.
          content:
            text/html:
              schema:
                type: string
        '403':
          description: Forbidden - Client IP not in allowlist or missing administrative privileges.
          content:
            text/html:
              schema:
                type: string

  /api/v1/monitor/overview:
    get:
      summary: System Vitals Telemetry
      description: Returns CPU load, memory usage, OPcache hit rate, and storage breakdown.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Telemetry data retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '403':
          description: Forbidden - Administrative authorization required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /api/v1/monitor/security:
    get:
      summary: Security Operations Center Telemetry
      description: Returns active throttled IPs, CSRF mismatches, and account lockout events.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Security telemetry data retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/monitor/traffic:
    get:
      summary: HTTP Traffic & Request Ingress Telemetry
      description: Returns request rates, latency distributions, and recent request traces.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Ingress telemetry retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/monitor/database:
    get:
      summary: Database Performance & Migration Telemetry
      description: Returns connection metrics, query timings, and migration state.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Database telemetry retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/monitor/queue:
    get:
      summary: Background Queue Telemetry
      description: Returns queue depths, worker heartbeats, and failed jobs list.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Queue metrics retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/monitor/queue/retry:
    post:
      summary: Retry Failed Background Job
      description: Moves a failed job from the dead-letter queue back to the active queue.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - job_id
              properties:
                job_id:
                  type: integer
      responses:
        '200':
          description: Job dispatched for retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/monitor/scheduler:
    get:
      summary: Task Scheduler Timeline
      description: Returns scheduled tasks, execution durations, and next countdowns.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Scheduler timeline retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/monitor/cache:
    get:
      summary: Cache Efficiency Metrics
      description: Returns cache hit/miss ratio, active keys, and distributed locks.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Cache metrics retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
    delete:
      summary: Flush System Cache
      description: Purges all stored keys from the application cache.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Cache flushed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/monitor/audit:
    get:
      summary: Compliance Audit Trail Explorer
      description: Returns live filterable audit log stream with cryptographic hash-chain verification status.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Audit logs retrieved with chain verification status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/monitor/routes:
    get:
      summary: Interactive Route Registry
      description: Returns complete table of registered routes, verbs, and active middleware stacks.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Route registry retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  # ── CIA Triad & IAM Administration Endpoints ─────────────────────────────────
  /api/v1/auth/login:
    post:
      summary: Authenticate User Identity (Email + Password)
      description: Validates credentials, checks account lockout status, and determines whether 2FA is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authentication successful or 2FA challenge triggered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '423':
          description: Account locked due to repeated failed attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /api/v1/auth/2fa/verify:
    post:
      summary: Verify Google Authenticator 2FA Code
      description: Validates 6-digit TOTP code with time-drift protection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: 2FA verified and session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          description: Invalid 2FA code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /api/v1/auth/2fa/setup:
    post:
      summary: Initiate Google Authenticator Enrollment
      description: Generates a new Base32 TOTP secret and pure SVG QR code for scanner enrollment.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: TOTP secret and QR code returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/auth/password/change:
    post:
      summary: Rotate User Password
      description: Validates current temporary password and replaces it with a new secure password, satisfying mandatory first-login password rotation.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
                - confirm_password
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                confirm_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password rotated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '422':
          description: Password policy validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: Terminate Session
      description: Destroys authenticated session and revokes active token.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/admin/users:
    get:
      summary: List Managed Users
      description: Returns paginated user records with roles, status, and 2FA states.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: User directory retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
    post:
      summary: Provision New User
      description: Creates a new user record with role assignment and audit logging.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                role:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User provisioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/admin/roles:
    get:
      summary: List RBAC Roles & Assigned Permissions
      description: Returns all system and custom roles with granular permission mappings.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Roles and permissions retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/admin/groups:
    get:
      summary: List Identity Groups
      description: Returns organizational groups and their assigned roles and members.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Groups list retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'

  /api/v1/account:
    get:
      summary: Get Authenticated User Profile & Preferences
      description: Returns the active session profile including username, display preference, roles, and groups.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: User profile retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /api/v1/account/profile:
    put:
      summary: Update Account Profile & Display Preferences
      description: Allows the user to update their full name, unique username, and preferred display name (name vs username).
      security:
        - SessionCookie: []
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - username
                - display_preference
              properties:
                name:
                  type: string
                  example: Timothy Dunn
                username:
                  type: string
                  example: nexus_admin
                display_preference:
                  type: string
                  enum: [name, username]
                  example: username
                avatar_url:
                  type: string
                  example: https://avatar.url/user.png
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /api/v1/account/password:
    post:
      summary: Change Account Password
      description: Rotates password with current password verification and Argon2id memory-hardened encryption.
      security:
        - SessionCookie: []
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
                - new_password_confirmation
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
                new_password_confirmation:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          description: Current password incorrect or unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'


